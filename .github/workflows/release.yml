# Builds static (musl) binaries when a v* tag is pushed, publishes them with SHA256SUMS,
# and attests where they came from (verify with: gh attestation verify <file> --repo sfmqrb/focus-track).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add "$TARGET"
      - run: cargo test --locked
      - name: build
        run: |
          export CC_${TARGET//-/_}=musl-gcc
          cargo build --release --locked --target "$TARGET"
      - name: package
        run: |
          name="focus-track-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$name"
          cp "target/$TARGET/release/focus-track" README.md LICENSE "$name/"
          cp -r extras "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            focus-track-*.tar.gz
            target/${{ matrix.target }}/release/focus-track
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: focus-track-*.tar.gz*
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - run: cat focus-track-*.sha256 > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes focus-track-*.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
